[package]
name = "kinetix-plugin-b-ai"
version = "0.1.0"
edition = "2021"
description = "Kinetix plugin: B.AI setup, live model discovery, and provider metadata."
license = "MIT"
repository = "https://github.com/PrightCord/kinetix-plugins"

[lib]
crate-type = ["cdylib"]

[dependencies]
kinetix-plugin-sdk = { path = "../../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
