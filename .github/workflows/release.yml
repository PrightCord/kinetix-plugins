name: plugin-release

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing plugin tag to rebuild/release, e.g. antigravity-oauth-v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: plugin-release-${{ github.event_name == 'push' && github.ref || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$DISPATCH_TAG"
            git fetch --force --tags origin
            git show-ref --verify --quiet "refs/tags/$TAG" || {
              echo "::error::workflow_dispatch only rebuilds an existing tag: $TAG"
              exit 1
            }
            git checkout --detach "refs/tags/$TAG"
          fi

          if [[ ! "$TAG" =~ ^([a-z0-9][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag must match <plugin-directory>-vX.Y.Z"
            exit 1
          fi

          SLUG="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          MANIFEST="plugins/$SLUG/plugin.toml"

          [ -f "$MANIFEST" ] || {
            echo "::error::no plugin manifest found at $MANIFEST"
            exit 1
          }

          python3 - "$MANIFEST" "$VERSION" "$TAG" "$GITHUB_OUTPUT" <<'PY'
          import pathlib
          import sys
          import tomllib

          manifest_path, expected_version, tag, output_path = sys.argv[1:]
          data = tomllib.loads(pathlib.Path(manifest_path).read_text())

          actual_version = data["version"]
          if actual_version != expected_version:
              raise SystemExit(
                  f"tag version {expected_version} does not match plugin.toml version {actual_version}"
              )

          slug = pathlib.Path(manifest_path).parent.name
          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"slug={slug}\n")
              out.write(f"version={actual_version}\n")
              out.write(f"plugin_id={data['id']}\n")
              out.write(f"plugin_name={data['name']}\n")
              out.write(f"tag={tag}\n")
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.259.0 --locked

      - name: Prepare official signing key
        id: signing
        env:
          SIGNING_KEY_PEM: ${{ secrets.KINETIX_PLUGIN_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_PEM" ]; then
            echo "::error::KINETIX_PLUGIN_SIGNING_KEY_PEM is required for official plugin releases"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/kinetix-plugin-signing-key.pem"
          printf '%s' "$SIGNING_KEY_PEM" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Build signed package and component binary
        env:
          KINETIX_PLUGIN_SIGNING_KEY_FILE: ${{ steps.signing.outputs.key_file }}
        run: |
          bash scripts/build-plugin.sh \
            "plugins/${{ steps.meta.outputs.slug }}" \
            --out-dir dist

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          PACKAGE="dist/${{ steps.meta.outputs.plugin_id }}-${{ steps.meta.outputs.version }}.kxp"
          COMPONENT="dist/${{ steps.meta.outputs.plugin_id }}-${{ steps.meta.outputs.version }}.wasm"

          [ -f "$PACKAGE" ]
          [ -f "$COMPONENT" ]
          tar -tf "$PACKAGE" | grep -qx 'signature.ed25519'
          wasm-tools validate --features component-model "$COMPONENT"

          (
            cd dist
            sha256sum \
              "${{ steps.meta.outputs.plugin_id }}-${{ steps.meta.outputs.version }}.kxp" \
              "${{ steps.meta.outputs.plugin_id }}-${{ steps.meta.outputs.version }}.wasm" \
              > SHA256SUMS
          )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.kxp
            dist/*.wasm

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PLUGIN_NAME: ${{ steps.meta.outputs.plugin_name }}
          PLUGIN_ID: ${{ steps.meta.outputs.plugin_id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGE="dist/$PLUGIN_ID-$VERSION.kxp"
          COMPONENT="dist/$PLUGIN_ID-$VERSION.wasm"
          CHECKSUMS="dist/SHA256SUMS"

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Official Kinetix plugin release for **$PLUGIN_NAME** (`$PLUGIN_ID`) v$VERSION.

          Artifacts:
          - `$PLUGIN_ID-$VERSION.kxp` — canonical signed package for installation in Kinetix.
          - `$PLUGIN_ID-$VERSION.wasm` — standalone WebAssembly Component binary.
          - `SHA256SUMS` — checksums for both artifacts.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" "$COMPONENT" "$CHECKSUMS" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$PACKAGE" "$COMPONENT" "$CHECKSUMS" \
              --verify-tag \
              --title "$PLUGIN_NAME v$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --repo "$GITHUB_REPOSITORY"
          fi
