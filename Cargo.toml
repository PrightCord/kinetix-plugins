# Standalone workspace for the Kinetix plugin SDK and first-party plugins.
[workspace]
members = ["sdk", "plugins/ai-studio", "plugins/antigravity-oauth", "plugins/b-ai", "plugins/claude-code-oauth", "plugins/opencode-free"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
